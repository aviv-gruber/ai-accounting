[project]
name = "ai-accounting"
version = "0.1.0"
description = "AI-powered accounting insights for small Israeli businesses"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.0",
    "plotly>=5.0",
    "pandas>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
